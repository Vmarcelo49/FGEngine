# F0 placeholder character: full SPEC §6.7 required set plus one special
# (236A). Minimal 1-2 frame data everywhere; real content replaces it.
# Sprites are 128x128 fixture PNGs, anchor bottom-center (64, 120).
# Boxes are authored in sprite-pixel space; the runtime subtracts the
# anchor (§6.6).

name = "PlaceHolder"

[properties]
maxHP = 10000

[animations.idle]
[[animations.idle.sprites]]
imgPath = "placeholder/idle.png"
anchor = { x = 64, y = 120 }
[[animations.idle.framedata]]
duration = 6
cancelTypes = ["any"]
boxes = { collision = [{ x = 32, y = 40, w = 64, h = 80 }], hurt = [{ x = 32, y = 40, w = 64, h = 80 }] }
[[animations.idle.framedata]]
duration = 6
cancelTypes = ["any"]
boxes = { collision = [{ x = 32, y = 40, w = 64, h = 80 }], hurt = [{ x = 32, y = 40, w = 64, h = 80 }] }
