# FGEngine CI: the full suite runs headless (sim and data packages carry
# no display dependency — see SPEC §11.5 and AGENTS.md §7), so no xvfb or
# display server is needed. Golden-hash tests pin behavior; the Go version
# comes from go.mod (toolchain changes are determinism-scope, SPEC §11.7).
name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Headless is not dependency-free: `./...` also compiles the editor,
      # whose image picker is cgo (`#cgo pkg-config: gtk+-3.0`, `-lX11`).
      # The X11/GL dev packages are Ebitengine's own Linux link set
      # (`internal/glfw/build_linux.go`: -lX11 -lXrandr -lXxf86vm -lXi
      # -lXcursor -lXinerama); GTK does not pull libXxf86vm in, so list
      # them all instead of trusting the runner image (AGENTS.md §8 item 3).
      - name: Install cgo build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxrandr-dev libxxf86vm-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libgtk-3-dev pkg-config
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (headless)
        run: go test ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi
